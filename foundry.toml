# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.30"
# Strip the CBOR metadata footer (IPFS source hash + solc version marker) from
# emitted bytecode so genesis-baked contracts are byte-identical across clones,
# dependency layouts, and machines. Compiler pin above is what's load-bearing;
# the in-bytecode version marker is just an artifact.
bytecode_hash = "none"
cache = true
cache_path = 'cache'
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 3
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
]

[profile.default.invariant]
runs = 128
depth = 64

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = 'long'
func_attrs_with_params_multiline = true
quote_style = 'double'
number_underscore = 'preserve'
multiline_func_header = 'params_first'


[etherscan]
 
## placeholders must be replaced with key ("string"), chain_id (number, non-quoted), and tenderly_foundry_verification_url ("string")
unknown_chain = { key = "$TENDERLY_ACCESS_KEY", chain = 0, url = "$TENDERLY_FOUNDRY_VERIFICATION_URL" }
